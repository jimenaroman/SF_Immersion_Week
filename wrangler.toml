# Must match the Worker name in the Cloudflare dashboard. If these drift you
# get two Workers: an empty one under the dashboard name, and the real app
# deployed under this one.
name = "sf-immersion-week"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"

# The built React app. The Worker serves the API and the site from one
# deployment, so there is no cross-origin call and no CORS to configure.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
SUPABASE_URL = ""

# SUPABASE_ANON_KEY and NVIDIA_API_KEY are secrets, not vars — set them with:
#   npx wrangler secret put SUPABASE_ANON_KEY
#   npx wrangler secret put NVIDIA_API_KEY
