# Must match the Worker name in the Cloudflare dashboard. If these drift you
# get two Workers: an empty one under the dashboard name, and the real app
# deployed under this one.
name = "sf-immersion-week-redo"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"

# Credentials are set in the dashboard, not here. Without this, every deploy
# deletes them first and the Worker starts with nothing set.
keep_vars = true

# The built React app. The Worker serves the API and the site from one
# deployment, so there is no cross-origin call and no CORS to configure.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# No [vars] block on purpose. A plain-text var declared here replaces whatever
# the dashboard holds on every deploy, so listing SUPABASE_URL was silently
# resetting it to "" each time. Secrets are not touched by a deploy, so all
# three live there instead:
#   SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, NVIDIA_KEY
# Set via the dashboard (Settings -> Variables and Secrets -> Secret), or:
#   npx wrangler secret put SUPABASE_URL
